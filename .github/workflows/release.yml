name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 前置校验：v0.8.1 两次发布失败是因为 SplitView activeStyle 的 TS 类型错误
  # 只在 CI 才被 pnpm build(tsc) 抓到。这里提前、低成本地拦住。
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Frontend unit tests
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm exec playwright install chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust tests
        run: cargo test
        working-directory: src-tauri

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            # 只出 NSIS（-setup.exe）：Windows 上 MSI 与 NSIS 混装会导致升级时
            # NSIS 去卸载 MSI（msiexec 需要提权）失败并弹「Error launching installer」。
            args: "--bundles nsis"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 版本号以 tag 为准：v0.12.0 → 0.12.0 写入三处版本字段，
      # 保证程序内「设置 → 关于」显示的版本与 tag / Release 资产完全一致（防止漏改）。
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const v = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          const patchJson = (p, fn) => {
            const o = JSON.parse(fs.readFileSync(p, 'utf8'));
            fn(o);
            fs.writeFileSync(p, JSON.stringify(o, null, 2) + '\n');
          };
          patchJson('package.json', (o) => (o.version = v));
          patchJson('src-tauri/tauri.conf.json', (o) => (o.version = v));
          const cargo = fs
            .readFileSync('src-tauri/Cargo.toml', 'utf8')
            .replace(/^version = ".*"/m, `version = "${v}"`);
          fs.writeFileSync('src-tauri/Cargo.toml', cargo);
          console.log(`synced app version -> ${v}`);
          NODE

      # releaseDraft: true —— 先建 Draft，三个平台全部成功后由 publish job 统一转正。
      # 否则第一个完成的 job 就把 release 发布成 Latest，用户会下到缺 Windows/ARM 资产的残缺版。
      - name: Build & release (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "${{ github.ref_name }}"
          # 不再使用固定功能清单模板：正文在 publish 阶段由 CHANGELOG.md 的本版本段落整体生成。
          # 这里只放占位，避免 Draft 阶段出现陈旧模板内容。
          releaseBody: "_本版本变更见 CHANGELOG.md 对应段落（发布时自动注入）。_"
          releaseDraft: true
          prerelease: false
          # 显式指定 features：default 解析在 CI 环境不稳定（v0.7.0/v0.7.1 曾缺失 sftp/http 模块）
          args: --features sftp,share ${{ matrix.args }}

  # 三个平台都成功后才把 Draft 转正；任何平台失败则 release 永远停留在 Draft，用户看不到残缺版本
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Release 说明 = CHANGELOG.md 的本版本段落（整体替换，不再拼接旧的功能清单模板）
      - name: Set release notes from CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VER="${TAG#v}"
          awk -v ver="$VER" '
            $0 ~ ("^## v" ver "([[:space:]]|$)") { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/changelog.md"
          if [ ! -s "$RUNNER_TEMP/changelog.md" ]; then
            echo "CHANGELOG.md 中无 v$VER 段落，保留默认 release notes"; exit 0
          fi
          {
            echo "## $TAG 变更"
            echo
            cat "$RUNNER_TEMP/changelog.md"
          } > "$RUNNER_TEMP/body.md"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/body.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest --repo "${{ github.repository }}"
