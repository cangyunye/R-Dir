name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 前置校验：v0.8.1 两次发布失败是因为 SplitView activeStyle 的 TS 类型错误
  # 只在 CI 才被 pnpm build(tsc) 抓到。这里提前、低成本地拦住。
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      # 拉全量 tag：version.test 断言「版本文件 == 最高 git tag」，tag 触发时
      # checkout 会带上当次 tag，而分支 workflow_dispatch 不拉任何 tag 会假失败
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.2
          run_install: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Frontend unit tests
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm exec playwright install chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust tests
        # --workspace 带上 rdir-nfs（client feature 启用客户端与协议/服务循环测试）
        run: cargo test --workspace --features rdir-nfs/client
        working-directory: src-tauri

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            # 只出 NSIS（-setup.exe）：Windows 上 MSI 与 NSIS 混装会导致升级时
            # NSIS 去卸载 MSI（msiexec 需要提权）失败并弹「Error launching installer」。
            args: "--bundles nsis"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    # 显式声明：tauri-action 创建 Draft Release 需 contents: write。
    # 仓库默认工作流权限若为只读，仅靠顶层 permissions 可能仍拿不到写权限，
    # 故在 job 级再显式声明一次（见根因：Release 创建报 403 Resource not accessible）。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.2
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 版本号以 tag 为准：v0.12.0 → 0.12.0 写入三处版本字段，
      # 保证程序内「设置 → 关于」显示的版本与 tag / Release 资产完全一致（防止漏改）。
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const v = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          const patchJson = (p, fn) => {
            const o = JSON.parse(fs.readFileSync(p, 'utf8'));
            fn(o);
            fs.writeFileSync(p, JSON.stringify(o, null, 2) + '\n');
          };
          patchJson('package.json', (o) => (o.version = v));
          patchJson('src-tauri/tauri.conf.json', (o) => (o.version = v));
          const cargo = fs
            .readFileSync('src-tauri/Cargo.toml', 'utf8')
            .replace(/^version = ".*"/m, `version = "${v}"`);
          fs.writeFileSync('src-tauri/Cargo.toml', cargo);
          // v0.40 NFS 插件 crate 与宿主同版（插件 manifest version / 面板展示）
          const pluginCargo = fs
            .readFileSync('src-tauri/crates/rdir-nfs/Cargo.toml', 'utf8')
            .replace(/^version = ".*"/m, `version = "${v}"`);
          fs.writeFileSync('src-tauri/crates/rdir-nfs/Cargo.toml', pluginCargo);
          console.log(`synced app version -> ${v}`);
          NODE

      # releaseDraft: true —— 先建 Draft，三个平台全部成功后由 publish job 统一转正。
      # 否则第一个完成的 job 就把 release 发布成 Latest，用户会下到缺 Windows/ARM 资产的残缺版。
      - name: Build & release (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "${{ github.ref_name }}"
          # 不再使用固定功能清单模板：正文在 publish 阶段由 CHANGELOG.md 的本版本段落整体生成。
          # 这里只放占位，避免 Draft 阶段出现陈旧模板内容。
          releaseBody: "_本版本变更见 CHANGELOG.md 对应段落（发布时自动注入）。_"
          releaseDraft: true
          prerelease: false
          # v0.40 发行版口径：关闭内嵌 nfs（省 ~600KB 安装包），NFS 能力经 .rdplugin
          # 伴生进程插件动态获得；nfs-sidecar 提供插件宿主与安装链路
          args: --no-default-features --features sftp,share,nfs-sidecar ${{ matrix.args }}

      # v0.40 NFS 伴生进程插件：每平台编译 rdir-nfs + 打 .rdplugin（zip 容器）
      # + 独立校验清单（sha256 来源独立于包本体），作为 Release 资产随版发布
      - name: Build NFS plugin (.rdplugin)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          cd src-tauri
          cargo build --release -p rdir-nfs --features rdir-nfs/client --bin rdir-nfs
          case "${{ matrix.platform }}" in
            macos-latest)
              if [ "${{ matrix.args }}" = "--target aarch64-apple-darwin" ]; then TARGET=aarch64-apple-darwin; else TARGET=x86_64-apple-darwin; fi
              BIN="target/${TARGET}/release/rdir-nfs" ;;
            windows-latest)
              TARGET=x86_64-pc-windows-msvc
              BIN="target/release/rdir-nfs.exe" ;;
            *) echo "unsupported platform"; exit 1 ;;
          esac
          PKG="rdir-nfs-plugin-v${VER}-${TARGET}.rdplugin"
          MANIFEST="rdir-nfs-manifest-${TARGET}.json"
          # 纯 Node stdlib 打包（zip deflate + 包内 manifest + 独立整包校验清单），跨平台字节级一致
          node ../tools/pack-nfs-plugin.mjs "$BIN" "$VER" "$TARGET" "$PKG" "$MANIFEST"
          gh release upload "$GITHUB_REF_NAME" "$PKG" "$MANIFEST" --clobber --repo "$GITHUB_REPOSITORY"
          echo "uploaded $PKG (+$MANIFEST)

  # 三个平台都成功后才把 Draft 转正；任何平台失败则 release 永远停留在 Draft，用户看不到残缺版本
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Release 说明 = CHANGELOG.md 的本版本段落（整体替换，不再拼接旧的功能清单模板）
      - name: Set release notes from CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VER="${TAG#v}"
          awk -v ver="$VER" '
            $0 ~ ("^## v" ver "([[:space:]]|$)") { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/changelog.md"
          if [ ! -s "$RUNNER_TEMP/changelog.md" ]; then
            echo "CHANGELOG.md 中无 v$VER 段落，保留默认 release notes"; exit 0
          fi
          {
            echo "## $TAG 变更"
            echo
            cat "$RUNNER_TEMP/changelog.md"
          } > "$RUNNER_TEMP/body.md"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/body.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest --repo "${{ github.repository }}"
