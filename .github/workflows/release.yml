name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 前置校验：v0.8.1 两次发布失败是因为 SplitView activeStyle 的 TS 类型错误
  # 只在 CI 才被 pnpm build(tsc) 抓到。这里提前、低成本地拦住。
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      # 拉全量 tag：version.test 断言「版本文件 == 最高 git tag」，tag 触发时
      # checkout 会带上当次 tag，而分支 workflow_dispatch 不拉任何 tag 会假失败
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.2
          run_install: false

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Frontend unit tests
        run: pnpm test

      - name: Install Playwright browser
        run: pnpm exec playwright install chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust tests
        # --workspace 带上 rdir-nfs（client feature 启用客户端与协议/服务循环测试）
        run: cargo test --workspace --features rdir-nfs/client
        working-directory: src-tauri

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # v0.47 起 macOS 只发 Apple Silicon（arm64）——Intel 机用户停留在 v0.46.0
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: windows-latest
            # 只出 NSIS（-setup.exe）：Windows 上 MSI 与 NSIS 混装会导致升级时
            # NSIS 去卸载 MSI（msiexec 需要提权）失败并弹「Error launching installer」。
            args: "--bundles nsis"
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    # 显式声明：tauri-action 创建 Draft Release 需 contents: write。
    # 仓库默认工作流权限若为只读，仅靠顶层 permissions 可能仍拿不到写权限，
    # 故在 job 级再显式声明一次（见根因：Release 创建报 403 Resource not accessible）。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.4.2
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 版本号以 tag 为准：v0.12.0 → 0.12.0 写入三处版本字段，
      # 保证程序内「设置 → 关于」显示的版本与 tag / Release 资产完全一致（防止漏改）。
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const v = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          const patchJson = (p, fn) => {
            const o = JSON.parse(fs.readFileSync(p, 'utf8'));
            fn(o);
            fs.writeFileSync(p, JSON.stringify(o, null, 2) + '\n');
          };
          patchJson('package.json', (o) => (o.version = v));
          patchJson('src-tauri/tauri.conf.json', (o) => (o.version = v));
          const cargo = fs
            .readFileSync('src-tauri/Cargo.toml', 'utf8')
            .replace(/^version = ".*"/m, `version = "${v}"`);
          fs.writeFileSync('src-tauri/Cargo.toml', cargo);
          // v0.40 NFS 插件 crate 与宿主同版（插件 manifest version / 面板展示）
          const pluginCargo = fs
            .readFileSync('src-tauri/crates/rdir-nfs/Cargo.toml', 'utf8')
            .replace(/^version = ".*"/m, `version = "${v}"`);
          fs.writeFileSync('src-tauri/crates/rdir-nfs/Cargo.toml', pluginCargo);
          console.log(`synced app version -> ${v}`);
          NODE

      # releaseDraft: true —— 先建 Draft，两个平台构建（macOS arm64 / Windows x64）
      # 全部成功后由 publish job 统一转正。
      # 否则第一个完成的 job 就把 release 发布成 Latest，用户会下到缺 Windows/ARM 资产的残缺版。
      - name: Build & release (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "${{ github.ref_name }}"
          # 不再使用固定功能清单模板：正文在 publish 阶段由 CHANGELOG.md 的本版本段落整体生成。
          # 这里只放占位，避免 Draft 阶段出现陈旧模板内容。
          releaseBody: "_本版本变更见 CHANGELOG.md 对应段落（发布时自动注入）。_"
          releaseDraft: true
          prerelease: false
          # v0.40 发行口径 = Cargo 默认 features（sftp,share,nfs-sidecar，无内嵌 NFS）。
          # tauri CLI 只有 --features（可加不可减），发行形态必须落在 default 上；
          # 此处不再传任何 feature 参数
          args: ${{ matrix.args }}

      # v0.41 实测：tauri-action 向 Draft 上传安装包可能静默失败（日志只打「Uploading …」
      # 不报错，3 个 job 挂 2 个），导致转正后的 Release 缺 Windows exe / x64 dmg。
      # 这里把每平台的 bundle 另存 workflow artifacts，publish 阶段校验缺失并兜底补传。
      - name: Archive bundles (publish 兜底补传源)
        uses: actions/upload-artifact@v4
        with:
          name: >-
            bundles-${{ matrix.platform == 'windows-latest' && 'windows-x64' || 'macos-aarch64' }}
          # 两种布局都要覆盖（v0.41.0 三发实测：`*/release` 只命中交叉编译的
          # target/<triple>/release/bundle，Windows 宿主构建是 target/release/bundle，
          # 中间没有 triple 段，永远匹配不到）；bundle 下还有 nsis/dmg/macos 子目录，
          # 必须 ** 递归（二发实测 * 只匹配一层）
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/*/release/bundle/**
          if-no-files-found: error
          retention-days: 3

      # v0.40 NFS 伴生进程插件：每平台编译 rdir-nfs + 打 .rdplugin（zip 容器）
      # + 独立校验清单（sha256 来源独立于包本体），作为 Release 资产随版发布
      - name: Build NFS plugin (.rdplugin)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          cd src-tauri
          case "${{ matrix.platform }}" in
            macos-latest)
              # 显式 --target：macos-latest 为 arm64 runner，宿主原生即 aarch64；
              # 保留显式声明以防 runner 架构变化（依赖 setup Rust 步骤已装的 targets）
              TARGET=aarch64-apple-darwin ;;
            windows-latest)
              TARGET=x86_64-pc-windows-msvc ;;
            *) echo "unsupported platform"; exit 1 ;;
          esac
          cargo build --release -p rdir-nfs --features rdir-nfs/client --bin rdir-nfs --target "$TARGET"
          # 按平台确定性选名（Git Bash 的 [ -f ] 有 MSYS 自动补 .exe 魔法，不可依赖）
          BIN_NAME="rdir-nfs"
          case "$TARGET" in *windows*) BIN_NAME="rdir-nfs.exe" ;; esac
          BIN="target/${TARGET}/release/$BIN_NAME"
          test -f "$BIN" || { echo "插件二进制不存在：$BIN"; exit 1; }
          PKG="rdir-nfs-plugin-v${VER}-${TARGET}.rdplugin"
          MANIFEST="rdir-nfs-manifest-${TARGET}.json"
          # 纯 Node stdlib 打包（zip deflate + 包内 manifest + 独立整包校验清单），跨平台字节级一致
          node ../tools/pack-nfs-plugin.mjs "$BIN" "$VER" "$TARGET" "$PKG" "$MANIFEST"
          gh release upload "$GITHUB_REF_NAME" "$PKG" "$MANIFEST" --clobber --repo "$GITHUB_REPOSITORY"
          echo "uploaded $PKG (+$MANIFEST)"

      # 绿色版（免安装）：单 exe + 便携标记（R-Dir.portable，paths.rs 据此把全部数据
      # 落到 exe 旁 data\）+ 说明 README，打成 zip 作为 Release 资产。
      - name: Pack portable zip (windows)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Windows 宿主构建在 target/release（无 triple 段）；交叉布局一并兜底
          $candidates = @(
            "src-tauri/target/release/R-Dir.exe",
            "src-tauri/target/x86_64-pc-windows-msvc/release/R-Dir.exe"
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "绿色版源 exe 不存在：$($candidates -join ', ')" }
          $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          $dir = "portable/R-Dir-Portable"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item $exe "$dir/R-Dir.exe"
          # 便携模式标记：存在且为文件即启用（见 src-tauri/src/paths.rs）
          New-Item -ItemType File -Force -Path "$dir/R-Dir.portable" | Out-Null
          Copy-Item "tools/portable-README.txt" "$dir/README.txt"
          $zip = "portable/R-Dir_${ver}_windows_x64_portable.zip"
          Compress-Archive -Path "$dir/*" -DestinationPath $zip -Force
          Write-Host "packed $zip"

      - name: Archive portable zip (publish 兜底补传源)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: portable-windows-x64
          path: portable/*.zip
          if-no-files-found: error
          retention-days: 3

      # web 服务（rdir-web）：无窗口文件服务单文件 zip。dist/ 已由 tauri-action 的
      # beforeBuildCommand（pnpm build）产出，rust-embed 编译期内嵌；--bin 只编
      # rdir-web，不重编 GUI。与 GUI/绿色版相互独立：rdir-web.exe 不依赖 WebView2。
      - name: Build rdir-web (windows)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'windows-latest'
        shell: bash
        working-directory: src-tauri
        run: |
          set -euo pipefail
          test -f ../dist/index.html || { echo "dist/index.html 不存在（web 版需内嵌前端产物）"; exit 1; }
          cargo build --release --features web --bin rdir-web

      - name: Pack web zip (windows)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $candidates = @(
            "src-tauri/target/release/rdir-web.exe",
            "src-tauri/target/x86_64-pc-windows-msvc/release/rdir-web.exe"
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "rdir-web.exe 不存在：$($candidates -join ', ')" }
          $ver = $env:GITHUB_REF_NAME -replace '^v', ''
          $dir = "webbuild/rdir-web"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item $exe "$dir/rdir-web.exe"
          Copy-Item "tools/web-README.txt" "$dir/README.txt"
          $zip = "webbuild/rdir-web_${ver}_windows_x64.zip"
          Compress-Archive -Path "$dir/*" -DestinationPath $zip -Force
          Write-Host "packed $zip"

      - name: Archive web zip (publish 兜底补传源)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: web-windows-x64
          path: webbuild/*.zip
          if-no-files-found: error
          retention-days: 3

  # 两个平台构建（macOS arm64 / Windows x64）都成功后才把 Draft 转正；任何平台失败则 release 永远停留在 Draft，用户看不到残缺版本
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Release 说明 = CHANGELOG.md 的本版本段落（整体替换，不再拼接旧的功能清单模板）
      - name: Set release notes from CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VER="${TAG#v}"
          awk -v ver="$VER" '
            $0 ~ ("^## v" ver "([[:space:]]|$)") { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/changelog.md"
          if [ ! -s "$RUNNER_TEMP/changelog.md" ]; then
            echo "CHANGELOG.md 中无 v$VER 段落，保留默认 release notes"; exit 0
          fi
          {
            echo "## $TAG 变更"
            echo
            cat "$RUNNER_TEMP/changelog.md"
          } > "$RUNNER_TEMP/body.md"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/body.md"

      # v0.41 安装包资产门禁：tauri-action 可能静默丢件（见 build job 注释）。
      # macOS dmg/app.tar.gz + Windows 安装包/绿色版 zip/web 服务 zip 共五件
      # 缺一不可——缺失先从 build artifacts 兜底补传，补不齐则本 job 失败，
      # Release 停留在 Draft，绝不把缺资产的版本发成 Latest。
      - name: Download bundles (repair source)
        uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: bundles-artifacts

      - name: Download portable zip (repair source)
        uses: actions/download-artifact@v4
        with:
          pattern: portable-*
          path: portable-artifacts

      - name: Download web zip (repair source)
        uses: actions/download-artifact@v4
        with:
          pattern: web-*
          path: web-artifacts

      - name: Verify & repair installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          TAG="$GITHUB_REF_NAME"
          # 兜底目录可能因上游 job 跳过而不存在，find 前置保证存在
          mkdir -p bundles-artifacts portable-artifacts web-artifacts
          existing="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort -u)"
          rc=0
          for a in \
            "R-Dir_${VER}_aarch64.dmg" \
            "R-Dir_aarch64.app.tar.gz" \
            "R-Dir_${VER}_x64-setup.exe" \
            "R-Dir_${VER}_windows_x64_portable.zip" \
            "rdir-web_${VER}_windows_x64.zip"
          do
            if grep -Fxq "$a" <<<"$existing"; then
              echo "ok: $a"; continue
            fi
            file="$(find bundles-artifacts portable-artifacts web-artifacts -name "$a" -print -quit)"
            if [ -z "$file" ]; then
              echo "::error::资产缺失且 build 产物中不存在：$a"; rc=1; continue
            fi
            gh release upload "$TAG" "$file" --clobber --repo "$GITHUB_REPOSITORY"
            echo "repaired: $a"
          done
          exit $rc

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest --repo "${{ github.repository }}"
