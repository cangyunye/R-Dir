[package]
name = "rust-file-manager"
version = "0.8.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
# 编译二进制名：与 productName 一致，保证 dev 模式 Dock/任务栏也显示 R-Dir
name = "R-Dir"
path = "src/main.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rust_file_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["test"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
trash = "5"
regex = "1"
ignore = "0.4"
# v0.8 压缩（zip / tar / tgz，仅打包，纯 Rust）
zip = "1"
tar = "0.4"
flate2 = "1"
# HTTP autoindex 插件：轻量同步 HTTP 客户端（rustls，无系统依赖）
ureq = { version = "2", default-features = false, features = ["rustls", "gzip"] }
# SFTP 远程文件系统插件（内置、可编译期拔出）：去掉 sftp feature 即不编译任何远程代码
russh = { version = "0.45", optional = true }
russh-keys = { version = "0.45", optional = true }
async-trait = "0.1"
# v0.7 分享服务（内置插件，feature = "share" 可编译期拔出）：内嵌 HTTP 文件服务
axum = { version = "0.8", optional = true, features = ["ws", "http1"] }
# 分享链接展示用局域网地址探测
local-ip-address = { version = "0.6", optional = true }
# 流式文件下载（ReaderStream）
tokio-util = { version = "0.7", optional = true, features = ["io"] }
futures-util = { version = "0.3", optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }
# 密码加密存储（master-key，AES-256-GCM；密钥仅存内存）
aes-gcm = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
rand = { version = "0.8", optional = true }

[features]
default = ["sftp", "share"]
sftp = ["dep:russh", "dep:russh-keys", "dep:tokio", "dep:aes-gcm", "dep:sha2", "dep:base64", "dep:rand"]
# v0.7 窗口分享（内置插件）：去掉 share 即不编译分享服务
share = ["dep:axum", "dep:tokio", "dep:local-ip-address", "dep:tokio-util", "dep:futures-util"]


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
# thin LTO：fat LTO 在 Windows MSVC 链接器上会 STATUS_STACK_BUFFER_OVERRUN（v0.7 全量命令回归后触发）
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
