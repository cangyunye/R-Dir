[package]
name = "rust-file-manager"
version = "0.28.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
# 编译二进制名：与 productName 一致，保证 dev 模式 Dock/任务栏也显示 R-Dir
name = "R-Dir"
path = "src/main.rs"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rust_file_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
trash = "5"
regex = "1"
ignore = "0.4"
# v0.21.1 文本比较编码切换（GBK/Big5/Shift_JIS 等 WhatWG 标准编码解码）
encoding_rs = "0.8"
# v0.27 画廊模式缩略图（本地图片解码缩放；按需特性裁掉不需要的格式）
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
# v0.9 压缩改为调用系统命令（ditto / powershell / tar / zip），不再依赖 Rust crate
# HTTP autoindex 插件：轻量同步 HTTP 客户端（rustls，无系统依赖）
ureq = { version = "2", default-features = false, features = ["rustls", "gzip"] }
# SFTP 远程文件系统插件（内置、可编译期拔出）：去掉 sftp feature 即不编译任何远程代码
russh = { version = "0.45", optional = true }
russh-keys = { version = "0.45", optional = true }
async-trait = "0.1"
# v0.7 分享服务（内置插件，feature = "share" 可编译期拔出）：内嵌 HTTP 文件服务
axum = { version = "0.8", optional = true, features = ["ws", "http1"] }
# 分享链接展示用局域网地址探测
local-ip-address = { version = "0.6", optional = true }
# 流式文件下载（ReaderStream）
futures-util = { version = "0.3", optional = true }
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "net", "time", "io-util", "sync", "macros"] }
# 密码加密存储（master-key，AES-256-GCM；密钥仅存内存）
aes-gcm = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
# v0.27 缩略图 base64 data URL（画廊模式）；sftp 也复用
base64 = "0.22"
rand = { version = "0.8", optional = true }

# 系统剪贴板文件格式（跨应用复制粘贴文件）：平台特定，仅编译对应平台
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSImage", "NSBitmapImageRep"] }
# v0.27 画廊模式：PDF/视频/Office 文档缩略图走系统 QuickLook（系统能预览的都能出图）
objc2-quick-look-thumbnailing = { version = "0.3", features = ["QLThumbnailGenerator", "QLThumbnailReply", "QLThumbnailGenerationRequest", "objc2-uniform-type-identifiers", "objc2-core-foundation", "block2"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSURL", "NSError", "NSGeometry"] }
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
objc2-uniform-type-identifiers = { version = "0.3", features = ["UTType"] }

[target.'cfg(target_os = "windows")'.dependencies]
clipboard-win = "5"
# 原生拖出（拖到浏览器上传/资源管理器）：OLE DoDragDrop + Shell 数据对象（CF_HDROP）
# windows-core 直接依赖：#[implement] 宏展开的代码引用 windows_core 路径
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
] }
windows-core = "0.62"

# 复制快速路径的系统调用（macOS clonefile / Linux FICLONE ioctl）
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["sftp", "share"]
sftp = ["dep:russh", "dep:russh-keys", "dep:tokio", "dep:aes-gcm", "dep:sha2", "dep:rand"]
# v0.7 窗口分享（内置插件）：去掉 share 即不编译分享服务
share = ["dep:axum", "dep:tokio", "dep:local-ip-address", "dep:futures-util"]


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
# thin LTO：fat LTO 在 Windows MSVC 链接器上会 STATUS_STACK_BUFFER_OVERRUN（v0.7 全量命令回归后触发）
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
